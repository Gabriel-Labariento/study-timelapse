name: Bug report
description: Something isn't working as expected.
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      placeholder: Describe the steps, including speed and camera settings.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 15.7
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Display and camera
      placeholder: Built-in display and camera, or the connected models
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Screenshots can help. Remove personal information before attaching them.
